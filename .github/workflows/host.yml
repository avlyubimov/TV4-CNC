name: Host logic and LVGL render
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [false, true]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-11-19
      - name: Fetch exact LVGL 9.2.2 source
        run: |
          git init vendor-lvgl
          git -C vendor-lvgl remote add origin https://github.com/lvgl/lvgl.git
          git -C vendor-lvgl fetch --depth=1 origin 7f07a129e8d77f4984fff8e623fd5be18ff42e74
          git -C vendor-lvgl checkout --detach FETCH_HEAD
      - name: Configure
        shell: bash
        run: |
          args=()
          if [[ '${{ matrix.sanitizer }}' == true ]]; then
            args+=('-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined')
          fi
          cmake -S . -B build -G Ninja -DLVGL_DIR="$PWD/vendor-lvgl" "${args[@]}"
      - run: cmake --build build -j 4
      - name: Analyze native release policy and local build metadata
        if: matrix.sanitizer == false
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/policy-analysis
          gcc --version > build/policy-analysis.log
          for name in json_guard envelope manifest; do
            gcc -std=c11 -Wall -Wextra -Werror -fanalyzer \
              -Ifirmware/esp32-hmi/ota -Ithird_party/cjson \
              -c "firmware/esp32-hmi/ota/$name.c" \
              -o "build/policy-analysis/$name.o" >> build/policy-analysis.log 2>&1
            printf '%s: actual-source analyzer PASS\n' "$name" >> build/policy-analysis.log
          done
          gcc -std=c11 -Wall -Wextra -Werror -fanalyzer -DESP_PLATFORM=1 \
            -DSERVICE_TEST_BENCH=0 -DSERVICE_TEST_PROVISIONED=1 -Itests/ota_service_sdk -Itests \
            -Ifirmware/esp32-hmi/ota -Ifirmware/esp32-hmi/network \
            -c firmware/esp32-hmi/ota/service.c \
            -o build/policy-analysis/service-configured.o >> build/policy-analysis.log 2>&1
          for name in session service; do
            gcc -std=c11 -Wall -Wextra -Werror -fanalyzer -Ifirmware/esp32-hmi/ota \
              -c "firmware/esp32-hmi/ota/$name.c" -o "build/policy-analysis/$name.o" >> build/policy-analysis.log 2>&1
          done
          gcc -std=c11 -Wall -Wextra -Werror -fanalyzer -DESP_PLATFORM=1 \
            -DSERVICE_TEST_SIGNED_BENCH=1 -DSERVICE_TEST_PROVISIONED=1 -DSERVICE_TEST_VALID_TRUST=1 \
            -Itests/ota_service_sdk -Itests -Ifirmware/esp32-hmi/ota -Ifirmware/esp32-hmi/network \
            -c firmware/esp32-hmi/ota/service.c \
            -o build/policy-analysis/service-signed-check.o >> build/policy-analysis.log 2>&1
          gcc -std=c11 -Wall -Wextra -Werror -fanalyzer -DTV4_OTA_SDK_TEST=1 \
            -Ifirmware/esp32-hmi/ota -Itests -c firmware/esp32-hmi/ota/installer_sdk.c \
            -o build/policy-analysis/installer.o >> build/policy-analysis.log 2>&1
          printf 'OTA session/service-window/actual SDK adapter: analyzer PASS\n' >> build/policy-analysis.log
          for stack_bench in 0 1; do
            gcc -std=c11 -Wall -Wextra -Werror -fanalyzer -DESP_PLATFORM=1 \
              -DSERVICE_TEST_BENCH="$stack_bench" -Itests/ota_service_sdk -Itests \
              -Ifirmware/esp32-hmi/ota -Ifirmware/esp32-hmi/network \
              -c firmware/esp32-hmi/ota/service.c \
              -o "build/policy-analysis/service-sdk-$stack_bench.o" >> build/policy-analysis.log 2>&1
          done
          printf 'Actual ESP service/control+worker8192 SDK boundary: analyzer PASS\n' >> build/policy-analysis.log
          gcc -std=c11 -Wall -Wextra -Werror -fanalyzer -DESP_PLATFORM=1 \
            -Itests/ota_tls_sdk -Itests/ota_service_sdk -Itests -Ifirmware/esp32-hmi/ota \
            -c firmware/esp32-hmi/ota/https.c -o build/policy-analysis/https-sdk.o >> build/policy-analysis.log 2>&1
          bash tools/analyze_ota_worker_tls.sh build/policy-analysis >> build/policy-analysis.log 2>&1
          gcc -std=c11 -Wall -Wextra -Werror -fanalyzer \
            -DTV4_LVGL_PSRAM_TEST=1 -DLV_CONF_SKIP=1 -DLV_USE_STDLIB_MALLOC=255 \
            -Itests -Ivendor-lvgl -c firmware/esp32-hmi/ui/lvgl_psram.c \
            -o build/policy-analysis/lvgl-psram.o >> build/policy-analysis.log 2>&1
          gcc -std=c11 -Wall -Wextra -Werror -fanalyzer \
            -Ifirmware/esp32-hmi/core -c firmware/esp32-hmi/core/firmware_info.c \
            -o build/policy-analysis/firmware_info.o >> build/policy-analysis.log 2>&1
          printf 'firmware_info: actual-source analyzer PASS\n' >> build/policy-analysis.log
          gcc -std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -Wstrict-prototypes \
            -D_POSIX_C_SOURCE=200809L -fanalyzer -Ifirmware/stm32-bootloader/include \
            -c firmware/stm32-bootloader/tools/motion_review.c \
            -o build/policy-analysis/motion_review.o >> build/policy-analysis.log 2>&1
          printf 'host motion_review: actual-source analyzer PASS\n' >> build/policy-analysis.log
          gcc -std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -Wstrict-prototypes \
            -fanalyzer -Iprotocol/can -c protocol/can/tests/fragment_test_link.c \
            -o build/policy-analysis/fragment_test_link.o >> build/policy-analysis.log 2>&1
          printf 'host fragment_test_link: actual-source analyzer PASS\n' >> build/policy-analysis.log
          gcc -std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -Wstrict-prototypes \
            -fanalyzer -pthread -Iprotocol/can -c protocol/can/tests/threaded_test_link.c \
            -o build/policy-analysis/threaded_test_link.o >> build/policy-analysis.log 2>&1
          printf 'host threaded_test_link: actual-source analyzer PASS\n' >> build/policy-analysis.log
          for name in hardware diagnostics runtime; do
            gcc -std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -Wstrict-prototypes \
              -fanalyzer -DTV4_BENCH_TEST_MMIO=1 -Ifirmware/stm32-motion/board/stm32f407vg \
              -c "firmware/stm32-motion/board/stm32f407vg/$name.c" \
              -o "build/policy-analysis/bench-$name.o" >> build/policy-analysis.log 2>&1
            printf 'bench %s: actual-source analyzer PASS\n' "$name" >> build/policy-analysis.log
          done
      - name: Race-check completion, dispatch, ingress, RX pause and signed update
        if: matrix.sanitizer == false
        shell: bash
        run: |
          set -euo pipefail
          cmake -S protocol/can -B build-thread-sanitize -G Ninja \
            -DCMAKE_C_FLAGS='-fsanitize=thread -fno-omit-frame-pointer -g -O1' \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
          cmake --build build-thread-sanitize --target update_completion_mailbox_tests update_completion_owner_tests update_driver_dispatch_tests update_frame_ingress_tests update_ingress_owner_tests -j4
          ctest --test-dir build-thread-sanitize -R '^(update_completion_mailbox_threads|update_completion_owner|update_driver_dispatch_threads|update_driver_dispatch|update_frame_ingress_threads|update_frame_ingress|update_ingress_owner_threads|update_ingress_owner)$' \
            -V --output-log "$PWD/build/thread-sanitizer.log"
          cmake -S firmware/stm32-bootloader -B build-boot-thread-sanitize -G Ninja \
            -DCMAKE_C_FLAGS='-fsanitize=thread -fno-omit-frame-pointer -g -O1' \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
          cmake --build build-boot-thread-sanitize --target boot_handoff_tests -j4
          ctest --test-dir build-boot-thread-sanitize -R '^boot_threaded_ingress_handoff$' \
            -V --output-log "$PWD/build/threaded-signed-sanitizer.log"
      - name: Race-check the actual allocation failure callback
        if: matrix.sanitizer == false
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=thread -fno-omit-frame-pointer -g -O1 \
            -DTV4_OTA_DMA_DIAG_TEST=1 -DTV4_OTA_DMA_DIAG_ENABLED=1 \
            -Itests -Ifirmware/esp32-hmi/ota tests/ota_dma_diagnostics_tests.c \
            firmware/esp32-hmi/ota/dma_diagnostics.c -pthread -o build/dma-thread-tests
          ./build/dma-thread-tests concurrent > build/dma-thread-sanitizer.log 2>&1
      - run: ctest --test-dir build --output-on-failure
      - name: Record actual app_main cold-render ordering (host SDK boundary)
        working-directory: build
        run: ./startup_tests audit > startup-audit.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: host-sanitized-${{ matrix.sanitizer }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/policy-analysis.log
            build/thread-sanitizer.log
            build/dma-thread-sanitizer.log
            build/threaded-signed-sanitizer.log
            build/startup-audit.log
            build/startup-first-frame.ppm
