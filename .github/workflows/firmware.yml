name: ESP-IDF compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sdk: [5.3.2, 6.1.1]
        profile: [headless, rev12]
        include:
          - sdk: 5.3.2
            image: espressif/idf@sha256:5b8f58d9d9caa45b689a31a0b6a0cc53b84594e0ba5fdd8d28eeef7d6123242a
          - sdk: 6.1.1
            image: espressif/idf@sha256:2b4f966c37eaedc19542b0637a5f850b2eff9478d8e858192aa0073d92c2dc91
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify image configuration (no hardware)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          # Compare file contents without relying on Git discovery inside the SDK container.
          lock_snapshot="$(mktemp -d)"
          cp -a firmware/esp32-hmi/locks/. "$lock_snapshot/"
          ./tools/build_idf.sh '${{ matrix.profile }}' '${{ matrix.sdk }}' local 2>&1 | tee evidence/build.log
          cp 'build-idf-${{ matrix.sdk }}-${{ matrix.profile }}/validation.json' evidence/
          diff -ru "$lock_snapshot/" firmware/esp32-hmi/locks/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idf-${{ matrix.sdk }}-${{ matrix.profile }}
          path: evidence/
