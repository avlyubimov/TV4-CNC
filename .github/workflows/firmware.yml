name: ESP-IDF compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sdk: [5.3.2, 6.1.1]
        profile: [headless, rev12, rev12-memory-bench, rev12-tls-bench]
        include:
          - sdk: 5.3.2
            image: espressif/idf@sha256:5b8f58d9d9caa45b689a31a0b6a0cc53b84594e0ba5fdd8d28eeef7d6123242a
          - sdk: 6.1.1
            image: espressif/idf@sha256:2b4f966c37eaedc19542b0637a5f850b2eff9478d8e858192aa0073d92c2dc91
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-11-19
      - name: Validate exact checkout inside SDK container
        shell: bash
        env:
          TV4_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Checkout's temporary HOME does not carry safe.directory into later
          # root SDK steps. Trust only this job's explicit workspace, never '*'.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$TV4_SOURCE_SHA"
      - name: Build and verify image configuration (no hardware)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-ci-evidence
          # Compare file contents without relying on Git discovery inside the SDK container.
          lock_snapshot="$(mktemp -d)"
          cp -a firmware/esp32-hmi/locks/. "$lock_snapshot/"
          ./tools/build_idf.sh '${{ matrix.profile }}' '${{ matrix.sdk }}' local 2>&1 | tee build-ci-evidence/build.log
          cp 'build-idf-${{ matrix.sdk }}-${{ matrix.profile }}/validation.json' build-ci-evidence/
          diff -ru "$lock_snapshot/" firmware/esp32-hmi/locks/
      - name: Verify inactive OTA layout, symbol linkage and memory bounds
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh" >/dev/null
          python tools/check_ota_layout.py --sdk "$IDF_PATH" > build-ci-evidence/ota-layout.log 2>&1
          python tools/check_ota_memory.py 'build-idf-${{ matrix.sdk }}-${{ matrix.profile }}/tv4_hmi.elf' > build-ci-evidence/ota-memory.json
          python - <<'PYCODE'
          import subprocess
          output = subprocess.check_output(['readelf', '-Ws', 'build-idf-${{ matrix.sdk }}-${{ matrix.profile }}/tv4_hmi.elf'], text=True)
          for symbol in ['tv4_ota_verify_manifest', 'tv4_ota_manifest_read', 'tv4_image_feed', 'tv4_image_finish', 'tv4_ota_signed_manifest_read', 'tv4_https_read', 'tv4_ota_session_run', 'tv4_ota_memory_acquire_psram', 'tv4_ota_memory_release', 'tv4_ota_workspace_bytes', 'tv4_time_adopt', 'tv4_time_check', 'tv4_time_clock_read', 'tv4_sntp_sync', 'tv4_sntp_run', 'tv4_tls_probe_run', 'tv4_ota_session_run_guarded', 'tv4_ota_resource_check', 'tv4_ota_resource_sample_current']:
              assert any(symbol in line and ' UND ' not in line for line in output.splitlines()), 'OTA entry point discarded or unresolved: ' + symbol
          if '${{ matrix.profile }}' == 'rev12-memory-bench':
              for symbol in ['tv4_ota_memory_bench_start', 'tv4_ota_memory_probe_buffers']:
                  assert any(symbol in line and ' UND ' not in line for line in output.splitlines()), 'Bench entry point missing: ' + symbol
          else:
              assert not any('tv4_ota_memory_bench_start' in line for line in output.splitlines()), 'Bench worker retained in ordinary image'
          if '${{ matrix.profile }}' == 'rev12-tls-bench':
              assert any('tv4_utc_tls_bench_start' in line and ' UND ' not in line for line in output.splitlines()), 'UTC/TLS bench entry missing'
              for symbol in ['mbedtls_x509_time_cmp', 'mbedtls_x509_time_gmtime']:
                  assert any(symbol in line and ' UND ' not in line for line in output.splitlines()), 'X.509 date check not linked: ' + symbol
          else:
              assert not any('tv4_utc_tls_bench_start' in line for line in output.splitlines()), 'UTC/TLS worker retained outside TLS bench'
          print('OTA symbols/profile gates verified; no installer enabled')
          PYCODE
      - name: Create and independently verify unsigned review candidate
        shell: bash
        env:
          TV4_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python tools/build_candidate.py create --repo . \
            --build 'build-idf-${{ matrix.sdk }}-${{ matrix.profile }}' \
            --output build-ci-candidate --source-commit "$TV4_SOURCE_SHA" \
            --sdk '${{ matrix.sdk }}' --profile '${{ matrix.profile }}' > build-ci-evidence/candidate-create.json
          python tools/build_candidate.py verify --candidate build-ci-candidate \
            --image 'build-idf-${{ matrix.sdk }}-${{ matrix.profile }}/tv4_hmi.bin' \
            --source-commit "$TV4_SOURCE_SHA" --sdk '${{ matrix.sdk }}' \
            --profile '${{ matrix.profile }}' > build-ci-evidence/candidate-verify.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: idf-${{ matrix.sdk }}-${{ matrix.profile }}
          path: build-ci-evidence/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-candidate-${{ matrix.sdk }}-${{ matrix.profile }}
          # Explicit metadata allowlist. Never upload app/ELF/build/NVS dumps.
          path: |
            build-ci-candidate/candidate.json
            build-ci-candidate/validation.json
            build-ci-candidate/dependencies.lock
            build-ci-candidate/LICENSE-NOTICE.md
            build-ci-candidate/checksums.sha256
          if-no-files-found: error
          retention-days: 14
