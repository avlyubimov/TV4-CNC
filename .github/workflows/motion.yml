name: STM32 foundation (no hardware)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  arm-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-11-19
      - name: Install exact ARM GNU Toolchain 14.2.Rel1
        shell: bash
        run: |
          set -euo pipefail
          archive=arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 \
            "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/$archive" -o "$RUNNER_TEMP/$archive"
          echo "62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"
      - name: Compile core, static analysis and object budget (not firmware)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          arm-none-eabi-gcc --version | tee evidence/compiler.txt
          cmake -S firmware/stm32-motion -B build-motion-arm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build build-motion-arm
          gcc -std=c11 -Wall -Wextra -Werror -fanalyzer -fsyntax-only \
            -Ifirmware/stm32-motion/core -Ifirmware/stm32-motion/startup -Ifirmware/stm32-motion/board \
            firmware/stm32-motion/core/supervisor.c firmware/stm32-motion/startup/memory_init.c \
            firmware/stm32-motion/board/noio.c
          python3 tools/check_motion_size.py build-motion-arm/libtv4_motion_core.a | tee evidence/core-size.txt
          python3 tools/check_motion_size.py build-motion-arm/libtv4_motion_boot_support.a | tee evidence/boot-support-size.txt
      - name: Compile bounded update transport (no CAN or Flash backend)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S protocol/can -B build-update-arm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/firmware/stm32-motion/cmake/arm-none-eabi.cmake" \
            -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build build-update-arm
          cmake --build build-update-arm --target help > evidence/update-arm-targets.txt
          if grep -Eq 'tv4_fragment_test_link|update_fragment_timing_tests|update_metadata_tests|update_metadata_setup_tests|update_fragment_raw_tests|update_channel_tests|update_frame_queue_tests|update_egress_tests|update_driver_events_tests|update_completion_mailbox_tests|update_completion_owner_tests|update_driver_dispatch_tests|update_frame_ingress_tests' evidence/update-arm-targets.txt; then
            echo 'ERROR: host fragment fixture leaked into ARM targets'; exit 1
          fi
          echo 'PASS host fragment fixture absent from ARM build' > evidence/fragment-test-scope.txt
          mkdir -p build-update-static
          gcc --version > evidence/update-static-analysis.txt
          for source in update_session update_outcome update_negotiation update_wire update_fragments update_metadata update_metadata_setup update_channel frame_queue update_egress update_driver_events completion_mailbox driver_dispatch frame_ingress; do
            gcc -std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -Wstrict-prototypes \
              -fanalyzer -Iprotocol/can -c "protocol/can/$source.c" -o "build-update-static/$source.o"
            printf 'PASS actual-source -fanalyzer -c %s\n' "$source" >> evidence/update-static-analysis.txt
          done
          python3 tools/check_update_wire_build.py build-update-arm > evidence/wire-budget.json
          python3 protocol/can/tests/wire_budget_tests.py --build build-update-arm > evidence/wire-budget-negative.txt 2>&1
          python3 tools/check_update_fragment_build.py build-update-arm > evidence/fragment-budget.json
          python3 protocol/can/tests/wire_budget_tests.py --fragments --build build-update-arm > evidence/fragment-budget-negative.txt 2>&1
          python3 tools/check_update_egress_build.py build-update-arm > evidence/egress-budget.json
          python3 tools/check_driver_events_build.py build-update-arm > evidence/driver-events-budget.json
          python3 tools/check_completion_mailbox_build.py build-update-arm > evidence/completion-mailbox-budget.json
          python3 tools/check_driver_dispatch_build.py build-update-arm > evidence/driver-dispatch-budget.json
          python3 tools/check_frame_ingress_build.py build-update-arm > evidence/frame-ingress-budget.json
          python3 protocol/can/tests/wire_budget_tests.py --egress --build build-update-arm > evidence/egress-budget-negative.txt 2>&1
          python3 protocol/can/tests/wire_budget_tests.py --driver-events --build build-update-arm > evidence/driver-events-budget-negative.txt 2>&1
          python3 protocol/can/tests/wire_budget_tests.py --completion-mailbox --build build-update-arm > evidence/completion-mailbox-budget-negative.txt 2>&1
          python3 protocol/can/tests/wire_budget_tests.py --driver-dispatch --build build-update-arm > evidence/driver-dispatch-budget-negative.txt 2>&1
          python3 protocol/can/tests/wire_budget_tests.py --frame-ingress --build build-update-arm > evidence/frame-ingress-budget-negative.txt 2>&1
          python3 tools/check_update_channel_build.py build-update-arm > evidence/channel-budget.json
          python3 protocol/can/tests/wire_budget_tests.py --channel --build build-update-arm > evidence/channel-budget-negative.txt 2>&1
          python3 tools/check_metadata_setup_build.py build-update-arm > evidence/metadata-setup-budget.json
          python3 protocol/can/tests/wire_budget_tests.py --setup --build build-update-arm > evidence/metadata-setup-budget-negative.txt 2>&1
          python3 tools/check_update_metadata_build.py build-update-arm > evidence/metadata-budget.json
          python3 protocol/can/tests/wire_budget_tests.py --metadata --build build-update-arm > evidence/metadata-budget-negative.txt 2>&1
          python3 tools/check_motion_size.py build-update-arm/libtv4_update_transport.a | tee evidence/update-size.txt
          arm-none-eabi-nm --undefined-only build-update-arm/libtv4_update_transport.a | tee evidence/update-symbols.txt
          cat build-update-arm/CMakeFiles/tv4_update_transport.dir/*.su > evidence/update-stack.txt
          python3 - <<'PY'
          from pathlib import Path
          symbols = Path('evidence/update-symbols.txt').read_text().splitlines()
          undefined = {line.split()[-1] for line in symbols if line.split() and 'U' in line.split()}
          assert undefined <= {'memcmp', 'memcpy', 'memmove', 'memset'}, undefined
          rows = [line.split('\t') for line in Path('evidence/update-stack.txt').read_text().splitlines()]
          assert rows and all(len(row) == 3 and row[2] == 'static' and int(row[1]) <= 128 for row in rows), rows
          print('PASS: libc memory helpers only; individual compiler frames <=128 bytes, not total runtime stack')
          PY
      - name: Link synthetic startup fixture and reject invalid layouts (no execution)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S firmware/stm32-motion -B build-motion-probe -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DTV4_MOTION_LINK_PROBE=ON
          cmake --build build-motion-probe
          python3 tools/check_motion_link.py build-motion-probe/tv4_motion_link_probe.elf > evidence/link-probe.json
          ctest --test-dir build-motion-probe --output-on-failure | tee evidence/link-contract.log
          arm-none-eabi-objdump -d --disassemble=Reset_Handler \
            build-motion-probe/tv4_motion_link_probe.elf > evidence/reset-disassembly.txt
          for probe in OFF ON; do
            if cmake -S firmware/stm32-motion -B "build-motion-blocked-$probe" \
                -DTV4_MOTION_BOARD_IMAGE=ON -DTV4_MOTION_LINK_PROBE="$probe" > "evidence/board-gate-$probe.txt" 2>&1; then
              echo 'ERROR: board image unexpectedly allowed'; exit 1
            fi
            grep -q 'F407 board image blocked' "evidence/board-gate-$probe.txt"
          done
          if cmake -S firmware/stm32-motion -B build-motion-host-probe \
              -DTV4_MOTION_LINK_PROBE=ON > evidence/host-probe-gate.txt 2>&1; then
            echo 'ERROR: host configure accepted ARM link probe'; exit 1
          fi
          grep -q 'requires the pinned ARM toolchain' evidence/host-probe-gate.txt
          # CMake may name its internal compiler-ABI archive *.bin; that cache
          # file is not a board image and is excluded from the upload allowlist.
          python3 - <<'PY'
          from pathlib import Path
          for directory in ('build-motion-arm', 'build-motion-probe', 'build-update-arm'):
              for path in Path(directory).rglob('*.bin'):
                  assert path.name == 'CMakeDetermineCompilerABI_C.bin' and 'CMakeFiles' in path.parts, path
          print('No firmware .bin; only permitted CMake compiler-ABI cache')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: motion-core-compile-evidence
          # Text evidence only; never publish the synthetic ELF/archive as firmware.
          path: |
            evidence/compiler.txt
            evidence/core-size.txt
            evidence/boot-support-size.txt
            evidence/link-probe.json
            evidence/link-contract.log
            evidence/reset-disassembly.txt
            evidence/board-gate-OFF.txt
            evidence/board-gate-ON.txt
            evidence/host-probe-gate.txt
            evidence/update-size.txt
            evidence/update-symbols.txt
            evidence/update-stack.txt
            evidence/update-static-analysis.txt
            evidence/wire-budget.json
            evidence/fragment-budget.json
            evidence/fragment-test-scope.txt
            evidence/wire-budget-negative.txt
            evidence/fragment-budget-negative.txt
            evidence/metadata-budget.json
            evidence/metadata-setup-budget.json
            evidence/channel-budget.json
            evidence/egress-budget.json
            evidence/driver-events-budget.json
            evidence/completion-mailbox-budget.json
            evidence/driver-dispatch-budget.json
            evidence/frame-ingress-budget.json
            evidence/metadata-budget-negative.txt
            evidence/metadata-setup-budget-negative.txt
            evidence/channel-budget-negative.txt
            evidence/egress-budget-negative.txt
            evidence/driver-events-budget-negative.txt
            evidence/completion-mailbox-budget-negative.txt
            evidence/driver-dispatch-budget-negative.txt
            evidence/frame-ingress-budget-negative.txt
          if-no-files-found: error
          retention-days: 14
