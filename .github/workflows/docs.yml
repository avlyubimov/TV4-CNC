name: Documentation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify mandatory project documents
        run: |
          set -eu
          test -s AGENTS.md
          test -s README.md
          test -s docs/CODEX_TASK_001.md
          test -s docs/ARCHITECTURE.md
          echo 'Documentation scaffold present'
