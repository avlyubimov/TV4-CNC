name: Documentation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-11-19
      - name: Verify mandatory project documents
        run: |
          set -eu
          test -s AGENTS.md
          test -s README.md
          test -s docs/CODEX_TASK_001.md
          test -s docs/ARCHITECTURE.md
          echo 'Documentation scaffold present'
