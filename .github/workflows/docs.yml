name: Documentation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-11-19
      - name: Verify mandatory project documents
        run: |
          set -eu
          test -s AGENTS.md
          test -s README.md
          test -s docs/CODEX_TASK_001.md
          test -s docs/ARCHITECTURE.md
          test -s docs/IMPLEMENTATION_PRIORITIES.md
          test -s docs/ESP32_OTA_INSTALLATION.md
          test -s docs/ESP32_OTA_WORKER_TLS_BENCH.md
          test -s docs/ESP32_OTA_BENCH_3927063.md
          test -s docs/plans/P1_AES_DMA_MEMORY.md
          test -s docs/plans/P1_DMA_ALLOCATION_TRACE.md
          test -s docs/plans/P1_LVGL_PSRAM_HEAP.md
          test -s docs/plans/P1_SIGNED_SESSION_RESOURCE.md
          test -s docs/plans/P1_SIGNED_CHECK_BUNDLE.md
          test -s docs/OTA_SIGNED_CHECK_BUNDLE.md
          test -s LICENSE
          test -s docs/evidence/build/ota-signed-check/README.md
          python3 -m json.tool docs/evidence/build/ota-signed-check/results.json > /dev/null
          test -s docs/evidence/build/ota-signed-check/publication.md
          python3 -m json.tool docs/evidence/build/ota-signed-check/publication.json > /dev/null
          test -s docs/plans/P1_CONFIGURED_WORKER_HEADROOM.md
          test -s docs/plans/P1_GITHUB_HEADERS.md
          test -s docs/plans/P1_AUTONOMOUS_SIGNED_CHECK.md
          test -s docs/plans/P1_PENDING_TRUST.md
          test -s docs/plans/P1_INSTALL_POLICY.md
          test -s docs/plans/P1_INSTALLABLE_BUNDLE.md
          test -s docs/plans/P1_PARTIAL_CANCEL.md
          test -s docs/plans/P1_WIFI_DISCONNECT_RETRY.md
          test -s docs/plans/P1_TIME_POLICY_REFUSAL.md
          test -s docs/evidence/build/esp32-ota-time-refusal/README.md
          for receipt in results source-ci configured-builds compiled-policy metadata-proof; do
            python3 -m json.tool "docs/evidence/build/esp32-ota-time-refusal/$receipt.json" > /dev/null
          done
          test -s docs/evidence/hardware/2026-11-25-esp32-time-policy/README.md
          for receipt in attempt1 host-ntp-reachability measurements; do
            python3 -m json.tool "docs/evidence/hardware/2026-11-25-esp32-time-policy/$receipt.json" > /dev/null
          done
          test -s docs/evidence/build/esp32-ota-wifi-retry/README.md
          for receipt in results source-ci; do
            python3 -m json.tool "docs/evidence/build/esp32-ota-wifi-retry/$receipt.json" > /dev/null
          done
          test -s docs/evidence/hardware/2026-11-24-esp32-wifi-retry/README.md
          for receipt in attempt1 button-observation measurements; do
            python3 -m json.tool "docs/evidence/hardware/2026-11-24-esp32-wifi-retry/$receipt.json" > /dev/null
          done
          test -s docs/evidence/build/esp32-ota-partial-cancel/README.md
          for receipt in results source-ci; do
            python3 -m json.tool "docs/evidence/build/esp32-ota-partial-cancel/$receipt.json" > /dev/null
          done
          test -s docs/evidence/hardware/2026-11-24-esp32-partial-cancel/README.md
          python3 -m json.tool docs/evidence/hardware/2026-11-24-esp32-partial-cancel/measurements.json > /dev/null
          test -s docs/plans/P1_RESET_ROLLBACK.md
          test -s docs/evidence/build/esp32-ota-reset-rollback/README.md
          for receipt in results source-ci; do
            python3 -m json.tool "docs/evidence/build/esp32-ota-reset-rollback/$receipt.json" > /dev/null
          done
          test -s docs/evidence/hardware/2026-11-24-esp32-reset-rollback/README.md
          python3 -m json.tool docs/evidence/hardware/2026-11-24-esp32-reset-rollback/measurements.json > /dev/null
          test -s docs/evidence/build/esp32-ota-display-progress/README.md
          python3 -m json.tool docs/evidence/build/esp32-ota-display-progress/results.json > /dev/null
          test -s docs/evidence/build/esp32-ota-display-bench4/README.md
          for receipt in results ci publication; do
            python3 -m json.tool "docs/evidence/build/esp32-ota-display-bench4/$receipt.json" > /dev/null
          done
          test -s docs/evidence/hardware/2026-11-24-esp32-display-bench4/README.md
          for receipt in attempt1 measurements; do
            python3 -m json.tool "docs/evidence/hardware/2026-11-24-esp32-display-bench4/$receipt.json" > /dev/null
          done
          test -s docs/evidence/build/esp32-ota-install-bench3/README.md
          python3 -m json.tool docs/evidence/build/esp32-ota-install-bench3/results.json > /dev/null
          test -s docs/evidence/hardware/2026-11-24-esp32-install-bench3/README.md
          for attempt in 1 2 3 4; do
            python3 -m json.tool "docs/evidence/hardware/2026-11-24-esp32-install-bench3/attempt${attempt}.json" > /dev/null
          done
          test -s docs/evidence/build/ota-installable-bundle/README.md
          python3 -m json.tool docs/evidence/build/ota-installable-bundle/results.json > /dev/null
          python3 -m json.tool docs/evidence/build/ota-installable-bundle/ci.json > /dev/null
          test -s docs/evidence/build/esp32-ota-install-policy/README.md
          python3 -m json.tool docs/evidence/build/esp32-ota-install-policy/results.json > /dev/null
          python3 -m json.tool docs/evidence/build/esp32-ota-install-policy/ci.json > /dev/null
          test -s docs/evidence/hardware/2026-11-24-esp32-install-policy-3b09bba/README.md
          python3 -m json.tool docs/evidence/hardware/2026-11-24-esp32-install-policy-3b09bba/measurements.json > /dev/null
          test -s docs/evidence/build/esp32-ota-pending-trust/README.md
          python3 -m json.tool docs/evidence/build/esp32-ota-pending-trust/results.json > /dev/null
          python3 -m json.tool docs/evidence/build/esp32-ota-pending-trust/ci.json > /dev/null
          test -s docs/evidence/hardware/2026-11-24-esp32-native-boot-a74bfcd/README.md
          python3 -m json.tool docs/evidence/hardware/2026-11-24-esp32-native-boot-a74bfcd/measurements.json > /dev/null
          test -s docs/evidence/build/esp32-ota-zero-length-check/README.md
          python3 -m json.tool docs/evidence/build/esp32-ota-zero-length-check/results.json > /dev/null
          python3 -m json.tool docs/evidence/build/esp32-ota-zero-length-check/ci.json > /dev/null
          test -s docs/evidence/hardware/2026-11-24-esp32-signed-check-a29c9ed/README.md
          python3 -m json.tool docs/evidence/hardware/2026-11-24-esp32-signed-check-a29c9ed/measurements.json > /dev/null
          test -s docs/evidence/hardware/2026-11-24-esp32-signed-check-repeat-a29c9ed/README.md
          python3 -m json.tool docs/evidence/hardware/2026-11-24-esp32-signed-check-repeat-a29c9ed/measurements.json > /dev/null
          test -s docs/evidence/build/esp32-ota-autonomous-check/README.md
          python3 -m json.tool docs/evidence/build/esp32-ota-autonomous-check/results.json > /dev/null
          python3 -m json.tool docs/evidence/build/esp32-ota-autonomous-check/ci.json > /dev/null
          test -s docs/evidence/hardware/2026-11-24-esp32-signed-check-b01ff48/README.md
          python3 -m json.tool docs/evidence/hardware/2026-11-24-esp32-signed-check-b01ff48/measurements.json > /dev/null
          python3 -m json.tool docs/evidence/hardware/2026-11-24-esp32-signed-check-b01ff48/http-header-shape.json > /dev/null
          test -s docs/evidence/hardware/2026-11-24-f407-readback/README.md
          python3 -m json.tool docs/evidence/hardware/2026-11-24-f407-readback/result.json > /dev/null
          test -s docs/evidence/hardware/2026-11-24-esp32-signed-check-471e109/README.md
          python3 -m json.tool docs/evidence/hardware/2026-11-24-esp32-signed-check-471e109/measurements.json > /dev/null
          python3 -m json.tool docs/evidence/hardware/2026-11-24-esp32-signed-check-471e109/http-header-shape.json > /dev/null
          test -s docs/evidence/hardware/2026-11-23-esp32-signed-check-c013ddf/README.md
          python3 -m json.tool docs/evidence/hardware/2026-11-23-esp32-signed-check-c013ddf/measurements.json > /dev/null
          test -s docs/evidence/build/esp32-lvgl-psram/README.md
          python3 -m json.tool docs/evidence/build/esp32-lvgl-psram/results.json > /dev/null
          test -s docs/evidence/hardware/2026-11-23-esp32-lvgl-38f70b9/README.md
          python3 -m json.tool docs/evidence/hardware/2026-11-23-esp32-lvgl-38f70b9/measurements.json > /dev/null
          test -s docs/evidence/build/esp32-ota-dma-trace/README.md
          python3 -m json.tool docs/evidence/build/esp32-ota-dma-trace/results.json > /dev/null
          test -s docs/evidence/hardware/2026-11-23-esp32-dma-46cf400/README.md
          python3 -m json.tool docs/evidence/hardware/2026-11-23-esp32-dma-46cf400/measurements.json > /dev/null
          test -s docs/evidence/hardware/2026-11-22-esp32-worker-tls-3927063/README.md
          python3 -m json.tool docs/evidence/hardware/2026-11-22-esp32-worker-tls-3927063/measurements.json > /dev/null
          test -s docs/evidence/build/esp32-ota-repeat-3927063/README.md
          test -s docs/plans/P1_OTA_WORKER_TLS_BENCH.md
          test -s docs/plans/P1_ESP32_OTA.md
          test -s docs/evidence/build/esp32-ota-installation/README.md
          test -s docs/STM32_FIRST_IMAGE.md
          test -s docs/STM32_STLINK_RUNBOOK.md
          test -s docs/plans/P0_STM32F407_FIRST_IMAGE.md
          test -s docs/STM32_IMAGE_ADMISSION.md
          test -s docs/STM32_UPDATE_HANDOFF.md
          test -s docs/STM32_IMAGE_PREFLIGHT.md
          test -s docs/STM32_UPDATE_OUTCOME.md
          test -s docs/STM32_UPDATE_NEGOTIATION.md
          test -s docs/STM32_RELEASE_BINDING.md
          test -s docs/STM32_RELEASE_HANDOFF.md
          test -s docs/STM32_STAGING_SOURCE.md
          test -s docs/RELEASE_COHORT_REVIEW.md
          test -s docs/RELEASE_BUILD_BINDING.md
          test -s docs/STM32_UPDATE_WIRE.md
          test -s docs/STM32_UPDATE_FRAGMENTS.md
          test -s docs/STM32_UPDATE_TIMING.md
          test -s docs/STM32_METADATA_TRANSPORT.md
          test -s docs/STM32_METADATA_SETUP.md
          test -s docs/STM32_UPDATE_CHANNEL.md
          test -s docs/STM32_UPDATE_EGRESS.md
          test -s docs/STM32_DRIVER_EVENTS.md
          test -s docs/STM32_COMPLETION_MAILBOX.md
          test -s docs/STM32_DRIVER_DISPATCH.md
          test -s docs/STM32_FRAME_INGRESS.md
          test -s docs/STM32_THREADED_LINK.md
          test -s docs/plans/PR07V_THREADED_LINK.md
          test -s docs/STM32_INGRESS_OWNER.md
          test -s docs/plans/PR07U_INGRESS_OWNER.md
          test -s docs/plans/PR07T_FRAME_INGRESS.md
          test -s docs/plans/PR07S_DRIVER_DISPATCH.md
          test -s docs/plans/PR07R_COMPLETION_MAILBOX.md
          test -s docs/plans/PR07Q_DRIVER_EVENTS.md
          test -s docs/plans/PR07P_UPDATE_EGRESS.md
          test -s docs/plans/PR07O_UPDATE_CHANNEL.md
          test -s docs/plans/PR07N_METADATA_SETUP.md
          test -s docs/RELEASE_POLICY_REVIEW.md
          test -s docs/REPRODUCIBLE_HMI.md
          test -s docs/plans/P2_REPRODUCIBLE_HMI.md
          test -s docs/evidence/build/esp32-ota-reproducible/README.md
          for receipt in results first-attempt source-ci; do
            python3 -m json.tool "docs/evidence/build/esp32-ota-reproducible/$receipt.json" > /dev/null
          done
          test -s docs/FIRMWARE_INFO_UI.md
          echo 'Documentation scaffold present'
