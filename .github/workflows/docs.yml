name: Documentation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-11-19
      - name: Verify mandatory project documents
        run: |
          set -eu
          test -s AGENTS.md
          test -s README.md
          test -s docs/CODEX_TASK_001.md
          test -s docs/ARCHITECTURE.md
          test -s docs/IMPLEMENTATION_PRIORITIES.md
          test -s docs/STM32_FIRST_IMAGE.md
          test -s docs/STM32_STLINK_RUNBOOK.md
          test -s docs/plans/P0_STM32F407_FIRST_IMAGE.md
          test -s docs/STM32_IMAGE_ADMISSION.md
          test -s docs/STM32_UPDATE_HANDOFF.md
          test -s docs/STM32_IMAGE_PREFLIGHT.md
          test -s docs/STM32_UPDATE_OUTCOME.md
          test -s docs/STM32_UPDATE_NEGOTIATION.md
          test -s docs/STM32_RELEASE_BINDING.md
          test -s docs/STM32_RELEASE_HANDOFF.md
          test -s docs/STM32_STAGING_SOURCE.md
          test -s docs/RELEASE_COHORT_REVIEW.md
          test -s docs/RELEASE_BUILD_BINDING.md
          test -s docs/STM32_UPDATE_WIRE.md
          test -s docs/STM32_UPDATE_FRAGMENTS.md
          test -s docs/STM32_UPDATE_TIMING.md
          test -s docs/STM32_METADATA_TRANSPORT.md
          test -s docs/STM32_METADATA_SETUP.md
          test -s docs/STM32_UPDATE_CHANNEL.md
          test -s docs/STM32_UPDATE_EGRESS.md
          test -s docs/STM32_DRIVER_EVENTS.md
          test -s docs/STM32_COMPLETION_MAILBOX.md
          test -s docs/STM32_DRIVER_DISPATCH.md
          test -s docs/STM32_FRAME_INGRESS.md
          test -s docs/STM32_THREADED_LINK.md
          test -s docs/plans/PR07V_THREADED_LINK.md
          test -s docs/STM32_INGRESS_OWNER.md
          test -s docs/plans/PR07U_INGRESS_OWNER.md
          test -s docs/plans/PR07T_FRAME_INGRESS.md
          test -s docs/plans/PR07S_DRIVER_DISPATCH.md
          test -s docs/plans/PR07R_COMPLETION_MAILBOX.md
          test -s docs/plans/PR07Q_DRIVER_EVENTS.md
          test -s docs/plans/PR07P_UPDATE_EGRESS.md
          test -s docs/plans/PR07O_UPDATE_CHANNEL.md
          test -s docs/plans/PR07N_METADATA_SETUP.md
          test -s docs/RELEASE_POLICY_REVIEW.md
          test -s docs/FIRMWARE_INFO_UI.md
          echo 'Documentation scaffold present'
