# P0 pinless bench only. A file to REVIEW before a separately authorized session.
# Sourcing stock target/stm32f4x.cfg alone performs an HSI->PLL 64MHz reset-init!
# Override those events; do not activate trace pins or change Flash protections.
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f4x.cfg]
reset_config none
adapter speed 1000
$_TARGETNAME configure -event reset-start { adapter speed 1000 }
$_TARGETNAME configure -event reset-init { adapter speed 1000 }
$_TARGETNAME configure -event examine-end {
    # Volatile debug halt behavior only; not option bytes or motion authority.
    mmw 0xE0042008 0x00001000 0
}
$_CHIPNAME.tpiu configure -event pre-enable {
    error "Pin trace is forbidden in the pinless STM32 bench profile"
}
